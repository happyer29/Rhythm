name: Feature request
description: Suggest a change to Rhythm.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and avoid sharing personal journal data.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what you would like to do, with a small example if helpful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches.
