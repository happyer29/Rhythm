name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install Flutter 3.47.6
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "5fc346839b5d0eef006ed8404392afb4dfae428d"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: |
          npm ci
          flutter pub get --enforce-lockfile

      - name: Analyze, test, and build Flutter and Worker
        run: npm run build

      - name: Run Node.js tests
        run: npm test

      - name: Check dependency locks
        run: git diff --exit-code -- package-lock.json pubspec.lock

      - name: Verify source packaging
        run: npm run prepare:source
